[package]
name = "spike-http-bench"
description = "THROWAWAY (proof S2): parallel Range download with reqwest over HTTP/1.1 against tools/bench/server.js."
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_IO", "Win32_System_Ioctl"] }

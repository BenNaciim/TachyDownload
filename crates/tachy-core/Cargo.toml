[package]
name = "tachy-core"
description = "Download engine of Tachy Download: no window, no Tauri, testable anywhere."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "process", "io-util"] }
tokio-util = "0.7"
# HTTP/1.1 only (no "http2" feature): one TCP connection per range is what makes the segments parallel.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# HLS: AES-128-CBC segments.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

# Only for examples/bench.rs: CPU time and peak memory of the process.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

name: Tests

# Runs the whole suite on every push and pull request, so a regression shows up before a release:
# the Rust engine and shell (format, lints as errors, tests), then the browser-driven tests of the real app and
# the extension's tests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # rust-toolchain.toml pins the compiler; rustup installs it on the first call.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -p tachy-core -p tachy-download -- --check

      - run: cargo clippy -p tachy-core -p tachy-download --all-targets -- -D warnings

      - run: cargo test -p tachy-core -p tachy-download

      # The binary the browser-driven tests (test/*.test.js) launch.
      - run: cargo build -p tachy-download

      - run: npm run lint

      # The window needs the WebView2 runtime. Without it the app stays up behind an error box and the browser-driven
      # tests never find a page. Report the version, and install the runtime when it is missing.
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          if ($v) {
            Write-Host "::notice title=WebView2::runtime $v"
          } else {
            Write-Host "::warning title=WebView2::runtime missing, installing it"
            $setup = Join-Path $env:TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            Start-Process $setup -ArgumentList '/silent', '/install' -Wait
            $v = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
            Write-Host "::notice title=WebView2::runtime now $v"
          }

      # A step that never ends would hold the job for six hours: it has its own limit, and what failed is repeated as an
      # annotation (the log itself asks for a sign-in).
      - name: npm test
        shell: bash
        timeout-minutes: 15
        run: npm test 2>&1 | tee test-output.txt

      - name: What failed
        if: failure()
        shell: bash
        run: node tools/ci-annotate.js test-output.txt

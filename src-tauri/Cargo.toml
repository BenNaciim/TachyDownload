[package]
name = "tachy-download"
description = "Tachy Download: multi-connection download manager with a browser extension."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
default-run = "tachy-download"

[lib]
name = "tachy_download_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachy-core = { path = "../crates/tachy-core" }

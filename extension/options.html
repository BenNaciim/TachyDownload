<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tachy Download</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.4 system-ui, sans-serif; width: 340px; margin: 14px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; margin: 8px 0; }
    input[type=text], input[type=number], input[type=password] { width: 100%; box-sizing: border-box; padding: 5px 7px; }
    label.inline { display: flex; gap: 6px; align-items: center; }
    button { padding: 6px 12px; }
    #status { margin-top: 8px; min-height: 1.3em; }
    .hint { opacity: .7; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Tachy Download</h1>
  <p class="hint">Dans l’application : Paramètres → Extension navigateur → copier le jeton.</p>
  <label>Jeton <input type="password" id="token" autocomplete="off"></label>
  <label>Port <input type="number" id="port" min="1" max="65535"></label>
  <label class="inline"><input type="checkbox" id="intercept"> Capturer les téléchargements du navigateur</label>
  <label>Ignorer les fichiers plus petits que (Mo, 0 = aucun) <input type="number" id="minSize" min="0"></label>
  <button id="save">Enregistrer et tester</button>
  <div id="status" role="status"></div>
  <script src="options.js"></script>
</body>
</html>

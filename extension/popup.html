<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tachy Download</title>
  <style>
    :root { color-scheme: light dark; --accent: #3b5bdb; }
    body { font: 14px/1.4 system-ui, sans-serif; width: 360px; margin: 0; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--accent); color: #fff; }
    header b { font-size: 15px; }
    header button { background: transparent; border: 1px solid rgba(255,255,255,.6); color: #fff; border-radius: 6px; padding: 3px 9px; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 6px; max-height: 340px; overflow: auto; }
    li { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; }
    li:hover { background: rgba(59, 91, 219, .1); }
    .info { flex: 1; min-width: 0; }
    .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .meta { font-size: 12px; opacity: .7; }
    li button { background: var(--accent); color: #fff; border: 0; border-radius: 7px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
    li button:disabled { opacity: .6; cursor: default; }
    .empty { padding: 18px 16px; opacity: .8; }
    #note { padding: 0 16px 12px; font-size: 12px; opacity: .75; }
  </style>
</head>
<body>
  <header><b>Tachy Download</b><button id="settings">Réglages</button></header>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>Aucune vidéo détectée sur cette page. Lancez la lecture : elle apparaîtra ici.</p>
  <p id="note"></p>
  <script src="popup.js"></script>
</body>
</html>
